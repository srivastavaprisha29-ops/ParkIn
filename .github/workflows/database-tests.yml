name: Database tests
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: parkin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -d parkin -v ON_ERROR_STOP=1 -f db/001_inventory.sql
      - run: psql -h localhost -U postgres -d parkin -v ON_ERROR_STOP=1 -f db/test_inventory.sql
