name: Browser tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Set up Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PARKIN_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: npm test
